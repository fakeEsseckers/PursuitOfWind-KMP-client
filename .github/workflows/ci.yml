name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests; let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Lint, tests, Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./scripts/check.sh

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux
          path: '**/build/reports/'
          retention-days: 7

  ios:
    name: iOS tests and simulator build
    # macOS minutes are expensive: run on main, and on pull requests labelled `ios`.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kotlin tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Build iosApp for the simulator (unsigned)
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -arch arm64
          CODE_SIGNING_ALLOWED=NO
          build
